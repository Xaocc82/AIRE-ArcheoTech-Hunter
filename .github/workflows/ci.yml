name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip==25.0.1
      - run: python -m pip install --no-deps -r requirements-build-ci.lock
      - run: python -m pip install --no-build-isolation --no-deps -r requirements-ci.lock
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m mypy src
      - run: python -m pytest
